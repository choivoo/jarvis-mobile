name: JARVIS Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: V2.2 release QA gate
        run: bash scripts/qa-v22.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Cache neural assets
        uses: actions/cache@v4
        with:
          path: |
            .jarvis-cache
            app/libs/sherpa-onnx-1.13.2.aar
            app/src/main/assets/jarvis_tts
          key: jarvis-supertonic3-2026-05-11-v1
      - name: Prepare standalone neural voice
        run: bash scripts/prepare-standalone-neural.sh
      - name: Build standalone debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload standalone APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v2.2-standalone-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v2.2-build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
