name: Release JARVIS Standalone APK

on:
  push:
    paths:
      - 'release/V2.2.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: V2.2 release QA gate
        run: bash scripts/qa-v22.sh
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Prepare embedded neural voice
        run: bash scripts/prepare-standalone-neural.sh
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-V2.2.0-Standalone.apk
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.0 >/dev/null 2>&1; then
            gh release upload v2.2.0 JARVIS-V2.2.0-Standalone.apk --clobber
          else
            gh release create v2.2.0 JARVIS-V2.2.0-Standalone.apk --target "${GITHUB_SHA}" --title "JARVIS V2.2.0 Reliability Core" --notes "V2.2 reliability release: automated QA gate, Crash Black Box diagnostics, stale voice callback protection, crash-safe AUTO voice routing, Korean overlay subtitles, British-English voice output, embedded Neural Local assets for manual testing, and the MARK II adaptive icon."
          fi
